<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pobrefy">
  <title>Pobrefy</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <div id="app" class="layout">
    <aside class="sidebar">
      <nav class="panel nav">
        <a class="brand" href="#/">
          <svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><path d="M16 2 4 6.5v8.2C4 22.6 9.2 28.4 16 30c6.8-1.6 12-7.4 12-15.3V6.5Z" fill="var(--green)"/><path d="M13 10.5v11l8.5-5.5Z" fill="#000"/></svg>
          <span>Pobre<b>fy</b></span>
        </a>
        <a href="#/" data-nav="home"><svg class="i"><use href="#i-home"/></svg>Início</a>
        <a href="#/search" data-nav="search"><svg class="i"><use href="#i-search"/></svg>Pesquisar</a>
        <a href="#/downloads" data-nav="downloads"><svg class="i"><use href="#i-download"/></svg>Downloads <span class="badge" id="dl-badge" hidden></span></a>
        <a href="#/settings" data-nav="settings"><svg class="i"><use href="#i-gear"/></svg>Configurações</a>
      </nav>
      <section class="panel library">
        <header class="lib-head">
          <a href="#/library" class="lib-title"><svg class="i"><use href="#i-library"/></svg>A tua biblioteca</a>
          <button class="icon-btn" data-action="new-playlist" title="Criar playlist"><svg class="i"><use href="#i-plus"/></svg></button>
        </header>
        <div class="chips" id="lib-chips">
          <button class="chip active" data-filter="playlists">Playlists</button>
          <button class="chip" data-filter="albums">Álbuns</button>
          <button class="chip" data-filter="artists">Artistas</button>
        </div>
        <div class="lib-list" id="lib-list"></div>
      </section>
    </aside>

    <main class="panel main" id="main">
      <div class="topbar" id="topbar">
        <div class="nav-arrows">
          <button class="round-btn" onclick="history.back()" aria-label="Voltar"><svg class="i"><use href="#i-left"/></svg></button>
          <button class="round-btn" onclick="history.forward()" aria-label="Avançar"><svg class="i"><use href="#i-right"/></svg></button>
        </div>
        <div class="search-box" id="search-box" hidden>
          <svg class="i"><use href="#i-search"/></svg>
          <input id="search-input" type="search" placeholder="O que queres ouvir?" autocomplete="off">
        </div>
        <div class="top-actions">
          <a class="pill-btn" href="#/settings" title="Configurações"><svg class="i"><use href="#i-gear"/></svg><span>Configurações</span></a>
          <button class="pill-btn" data-action="rescan" title="Voltar a ler a pasta de música"><svg class="i"><use href="#i-refresh"/></svg><span>Atualizar biblioteca</span></button>
        </div>
      </div>
      <div id="view" class="view"></div>
    </main>

    <aside class="panel queue-panel" id="queue-panel" hidden>
      <header><h3>Fila</h3><button class="icon-btn" data-action="toggle-queue"><svg class="i"><use href="#i-close"/></svg></button></header>
      <div id="queue-list"></div>
    </aside>

    <footer class="player" id="player">
      <div class="now" data-action="open-now">
        <img id="np-cover" class="cover-sm" alt="">
        <div class="np-meta">
          <a id="np-title" class="np-title"></a>
          <a id="np-artist" class="np-artist"></a>
        </div>
        <button class="icon-btn like-btn" id="np-like" data-action="like-current" aria-label="Gosto"><svg class="i"><use href="#i-heart"/></svg></button>
        <button class="icon-btn mini-play" id="mini-play" data-action="toggle" aria-label="Reproduzir"><svg class="i"><use href="#i-play"/></svg></button>
      </div>
      <div class="controls">
        <div class="ctrl-buttons">
          <button class="icon-btn" id="btn-shuffle" data-action="shuffle" title="Aleatório"><svg class="i"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" data-action="prev" title="Anterior"><svg class="i"><use href="#i-prev"/></svg></button>
          <button class="play-btn" id="btn-play" data-action="toggle" title="Reproduzir"><svg class="i"><use href="#i-play"/></svg></button>
          <button class="icon-btn" data-action="next" title="Seguinte"><svg class="i"><use href="#i-next"/></svg></button>
          <button class="icon-btn" id="btn-repeat" data-action="repeat" title="Repetir"><svg class="i"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="progress-row">
          <span id="t-cur">0:00</span>
          <div class="slider" id="seek"><div class="fill"></div><div class="knob"></div></div>
          <span id="t-dur">0:00</span>
        </div>
      </div>
      <div class="extra">
        <button class="icon-btn" data-action="toggle-queue" id="btn-queue" title="Fila"><svg class="i"><use href="#i-queue"/></svg></button>
        <button class="icon-btn" data-action="mute" id="btn-vol" title="Volume"><svg class="i"><use href="#i-volume"/></svg></button>
        <div class="slider vol" id="vol"><div class="fill"></div><div class="knob"></div></div>
      </div>
      <div class="mini-progress"><div id="mini-fill"></div></div>
    </footer>

    <nav class="bottom-nav">
      <a href="#/" data-nav="home"><svg class="i"><use href="#i-home"/></svg>Início</a>
      <a href="#/search" data-nav="search"><svg class="i"><use href="#i-search"/></svg>Pesquisar</a>
      <a href="#/library" data-nav="library"><svg class="i"><use href="#i-library"/></svg>Biblioteca</a>
      <a href="#/downloads" data-nav="downloads"><svg class="i"><use href="#i-download"/></svg>Downloads</a>
    </nav>
  </div>

  <!-- ecrã "a tocar" (telemóvel) -->
  <div class="now-full" id="now-full" hidden>
    <header>
      <button class="icon-btn" data-action="close-now"><svg class="i"><use href="#i-down"/></svg></button>
      <span id="nf-context">A tocar</span>
      <button class="icon-btn" data-action="nf-menu"><svg class="i"><use href="#i-more"/></svg></button>
    </header>
    <img id="nf-cover" class="nf-cover" alt="">
    <div class="nf-meta">
      <div><div id="nf-title" class="nf-title"></div><div id="nf-artist" class="nf-artist"></div></div>
      <button class="icon-btn like-btn" id="nf-like" data-action="like-current"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div class="slider" id="nf-seek"><div class="fill"></div><div class="knob"></div></div>
    <div class="nf-times"><span id="nf-cur">0:00</span><span id="nf-dur">0:00</span></div>
    <div class="nf-controls">
      <button class="icon-btn" id="nf-shuffle" data-action="shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="icon-btn big" data-action="prev"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="play-btn huge" id="nf-play" data-action="toggle"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="icon-btn big" data-action="next"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="icon-btn" id="nf-repeat" data-action="repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="nf-bottom"><button class="icon-btn" data-action="nf-queue"><svg class="i"><use href="#i-queue"/></svg></button></div>
  </div>

  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <svg viewBox="0 0 32 32" class="logo big" aria-hidden="true"><path d="M16 2 4 6.5v8.2C4 22.6 9.2 28.4 16 30c6.8-1.6 12-7.4 12-15.3V6.5Z" fill="var(--green)"/><path d="M13 10.5v11l8.5-5.5Z" fill="#000"/></svg>
      <h1>Entrar no Pobrefy</h1>
      <input type="password" id="login-pass" placeholder="Palavra-passe" autocomplete="current-password" required>
      <button class="primary-btn" type="submit">Entrar</button>
      <p class="login-err" id="login-err"></p>
    </form>
  </div>

  <div id="menu" class="ctx-menu" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <audio id="audio" preload="auto"></audio>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2.5 11h2.7v9.5h5.3v-6h3v6h5.3V11h2.7Z" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.74 4.74-1.41 1.41-4.74-4.74A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z" fill="currentColor"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm4.4.6 1.9-.7 6.2 17.3-1.9.7z" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M11 3h2v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6Zm-7 15h16v2H4z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7Z" fill="currentColor"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.6 5 1.4 1.4L10.4 12l5.6 5.6-1.4 1.4-7-7Z" fill="currentColor"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.4 5 8 6.4l5.6 5.6L8 17.6 9.4 19l7-7Z" fill="currentColor"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m5 9.4 1.4-1.4 5.6 5.6L17.6 8 19 9.4l-7 7Z" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l10-7Zm11 0h2.5v14H16z" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5v14L9 12Zm-11 0H5.5v14H8z" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M17 3l4 3.5-4 3.5V7.5h-1.7c-1.4 0-2.3.6-3.2 1.9L7.6 16c-1.2 1.8-2.7 2.5-4.6 2.5H2v-2h1c1.2 0 2-.4 2.8-1.6l4.5-6.6c1.2-1.8 2.8-2.8 5-2.8H17Zm0 11 4 3.5-4 3.5v-2.5h-1.7c-2 0-3.5-.8-4.6-2.3l-.6-.9 1.2-1.7.9 1.4c.8 1.1 1.7 1.5 3.1 1.5H17ZM2 5.5h1c1.9 0 3.4.7 4.6 2.4l.5.7-1.2 1.7-.9-1.3C5.1 7.9 4.3 7.5 3 7.5H2Z" fill="currentColor"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 5h10a4 4 0 0 1 4 4v3h-2V9a2 2 0 0 0-2-2H7v2.5L3.5 6 7 2.5Zm10 14H7a4 4 0 0 1-4-4v-3h2v3a2 2 0 0 0 2 2h10v-2.5l3.5 3.5-3.5 3.5Z" fill="currentColor"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5 10.6 19.2C5.6 14.7 2.5 11.9 2.5 8.4A4.9 4.9 0 0 1 7.4 3.5c1.7 0 3.4.8 4.6 2.1a6.2 6.2 0 0 1 4.6-2.1 4.9 4.9 0 0 1 4.9 4.9c0 3.5-3.1 6.3-8.1 10.8Zm0-2.7c4.4-4 7.5-6.7 7.5-9.4a2.9 2.9 0 0 0-2.9-2.9c-1.3 0-2.6.8-3.1 2h-3c-.5-1.2-1.8-2-3.1-2a2.9 2.9 0 0 0-2.9 2.9c0 2.7 3.1 5.4 7.5 9.4Z" fill="currentColor"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20.5 10.6 19.2C5.6 14.7 2.5 11.9 2.5 8.4A4.9 4.9 0 0 1 7.4 3.5c1.7 0 3.4.8 4.6 2.1a6.2 6.2 0 0 1 4.6-2.1 4.9 4.9 0 0 1 4.9 4.9c0 3.5-3.1 6.3-8.1 10.8Z" fill="currentColor"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 5h14v2H3zm0 6h14v2H3zm0 6h9v2H3zm12-1.5v6l5-3Z" fill="currentColor"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z" fill="currentColor"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13.6.2 1.4-1.4 2 2 2-2 1.4 1.4-2 2 2 2-1.4 1.4-2-2-2 2-1.4-1.4 2-2Z" fill="currentColor"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4Z" fill="currentColor"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16Zm-1 3h2v4.6l3.5 2-1 1.7L11 12.8Z" fill="currentColor"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8Zm8 8a8 8 0 0 1-15.4 3H7v-2H1v6h2v-2.3A10 10 0 0 0 22 12Z" fill="currentColor"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 4v10.6A3.5 3.5 0 1 0 11 18V8h8V4Z" fill="currentColor"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 11c4.4 0 8 2 8 5v2H4v-2c0-3 3.6-5 8-5Z" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4Zm-3 6h12l-1 12H7Z" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4Z" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61ZM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6Z" fill="currentColor"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15.2 3.8 5 5L9 20H4v-5Zm0 2.8L6 15.8V18h2.2l9.2-9.2Z" fill="currentColor"/></symbol>
  </svg>
  <script src="/static/app.js?v=2"></script>
</body>
</html>
