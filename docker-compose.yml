services:
  npeh-music:
    build: .
    image: npeh-music:latest
    container_name: npeh-music
    restart: unless-stopped
    ports:
      - "8800:8800"
    env_file: .env
    volumes:
      # pasta de música (definida em MUSIC_HOST no .env)
      - ${MUSIC_HOST:-/mnt/dietpi_userdata/music}:/music
      # base de dados, capas e chave de sessão
      - ./data:/data
    # DNS fiável: o do router falha de vez em quando e deixava pesquisas e capas por carregar
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 1g
    # no máximo 1 dos 2 núcleos e prioridade baixa: os downloads não podem deixar o servidor sem resposta
    cpus: 1.0
    cpu_shares: 256
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
